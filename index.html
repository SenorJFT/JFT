<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFT Foro</title>
    <style>
        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid #1f2233;
        }
        h1 { margin: 0; color: #ff3366; }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #161925;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <header>
        <h1>Zona de Debate Futbolero</h1>
        <p>Discusiones, opiniones y debates sin filtro.</p>
    </header>

    <div class="container">
        <h2>Debate Principal: ¿Quién es el mejor de la temporada?</h2>
        <p>Iniciá sesión con tu cuenta para dejar tu opinión o abrir un debate.</p>
        
        <!-- Acá se conecta el sistema de comentarios/foro de Giscus -->
        <script src="https://giscus.app/client.js"
        data-repo="TU_USUARIO_DE_GITHUB/NOMBRE_DE_TU_REPO"
        data-repo-id="A_REEMPLAZAR"
        data-category="General"
        data-category-id="A_REEMPLAZAR"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="dark"
        data-lang="es"
        crossorigin="anonymous"
        async>
        </script>
    </div>
</body>
</html>
